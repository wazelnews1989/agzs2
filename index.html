<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сводки АГЗС</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1450C8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: one phone-width column, big tap targets, summary first; meter digits set like a pump counter. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --sunk:#E2E8ED; --ink:#0E1B24; --muted:#4A5C69; --line:#C6D1D9;
  --accent:#1450C8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FA;
  --ok:#1C7A49; --ok-bg:#DCF1E4; --warn:#8F5500; --warn-bg:#FCEDCF; --bad:#B0261D; --bad-bg:#FADFDB;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C151B; --surface:#152029; --sunk:#0F1920; --ink:#E7EDF1; --muted:#9CADBA; --line:#2B3A45;
  --accent:#7AA2FF; --accent-ink:#061024; --accent-soft:#1B2B4D;
  --ok:#62CF93; --ok-bg:#12321F; --warn:#F1B451; --warn-bg:#372810; --bad:#FF8B80; --bad-bg:#3C1613;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151B; --surface:#152029; --sunk:#0F1920; --ink:#E7EDF1; --muted:#9CADBA; --line:#2B3A45;
  --accent:#7AA2FF; --accent-ink:#061024; --accent-soft:#1B2B4D;
  --ok:#62CF93; --ok-bg:#12321F; --warn:#F1B451; --warn-bg:#372810; --bad:#FF8B80; --bad-bg:#3C1613;
  color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 9px 5px;border-radius:50% 50% 45% 45%;background:var(--accent-ink)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:16px;font-weight:500;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.today{display:flex;flex-direction:column;gap:2px}
.today .d{font-size:18px;color:var(--muted)}
.today .t{font-family:var(--f-display);font-size:26px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.label{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.hint{font-size:17px;color:var(--muted)}
.big{font-size:40px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{border:0;border-radius:var(--r);min-height:68px;padding:14px 20px;font-size:22px;font-weight:700;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:disabled{opacity:.45;cursor:not-allowed}
.btn-soft{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn-ok{background:var(--ok);color:var(--surface)}
.btn-danger{background:var(--bad-bg);color:var(--bad);border:2px solid var(--bad)}
.link{border:0;background:none;color:var(--accent);font-size:18px;font-weight:500;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;min-height:44px}

/* gauge */
.gauge{position:relative;height:30px;background:var(--sunk);border-radius:8px;overflow:visible;border:1px solid var(--line)}
.gauge.sm{height:18px}
.gauge-fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.gauge-fill.low{background:var(--warn)} .gauge-fill.crit{background:var(--bad)}
.gauge-max{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.gauge-max span{position:absolute;top:100%;transform:translateX(-50%);font-size:13px;color:var(--muted);white-space:nowrap;padding-top:4px}
.gauge-wrap{padding-bottom:20px}
.tank-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tank-num .of{font-size:18px;color:var(--muted)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 6px;min-height:96px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.slot b{font-size:21px} .slot span{font-size:17px;color:var(--muted)}
.slot em{font-style:normal;font-size:14px;font-weight:700;color:var(--ok);margin-top:2px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}

/* meter input */
.meter{width:100%;box-sizing:border-box;font-family:var(--f-num);font-size:40px;font-weight:700;text-align:center;letter-spacing:.06em;
  padding:14px 10px;border-radius:var(--r);border:3px solid var(--ink);background:var(--sunk);font-variant-numeric:tabular-nums}
.meter::placeholder{color:var(--muted);opacity:.5}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:19px;font-weight:700}
.txt{width:100%;box-sizing:border-box;font-size:22px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);min-height:60px}
.prev{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--muted)}
.prev .num{color:var(--ink);font-weight:700}
.calc{border-radius:12px;padding:14px 16px;background:var(--sunk);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc .v{font-family:var(--f-num);font-size:30px;font-weight:700}
.calc.ok{background:var(--ok-bg)} .calc.ok .v{color:var(--ok)}
.msg{border-radius:12px;padding:14px 16px;font-size:19px;font-weight:500}
.msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.info{background:var(--accent-soft);color:var(--ink)}

/* owner */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.sum .v{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.15}
.sum .v.bad{color:var(--bad)} .sum .v.ok{color:var(--ok)}
.st-card{text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.st-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.st-name{font-size:23px;font-weight:700;min-width:0}
.st-total{font-family:var(--f-num);font-size:20px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border-radius:10px;padding:8px 6px;text-align:center;font-size:15px;line-height:1.25;min-width:0}
.chip b{display:block;font-size:16px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.wait{background:var(--sunk);color:var(--muted)}
.chip.soon{background:var(--warn-bg);color:var(--warn)} .chip.late{background:var(--bad-bg);color:var(--bad)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;background:var(--bad-bg);color:var(--bad)}
.tank-line{font-size:17px;color:var(--muted)} .tank-line b{color:var(--ink)}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-num)} td.miss{color:var(--bad);font-family:var(--f-body)} td.tot{font-weight:700}

.list{display:flex;flex-direction:column}
.list > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:18px;flex-wrap:wrap}
.list > div:last-child{border-bottom:0}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;min-height:40px}
.mini.danger{border-color:var(--bad);color:var(--bad)}

.picker{display:flex;flex-direction:column;gap:12px}
.picker .btn{justify-content:flex-start;text-align:left;font-size:24px;min-height:80px}

.done{align-items:center;text-align:center;padding-block:32px}
.check{width:120px;height:120px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.check svg{width:64px;height:64px}
@media (prefers-reduced-motion: no-preference){.check{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}

.banner{border-radius:12px;padding:12px 16px;background:var(--warn-bg);color:var(--warn);font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner .mini{background:transparent;color:var(--warn);border-color:var(--warn)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.empty{text-align:center;align-items:center;padding-block:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.back{align-self:flex-start}

body{margin:0;padding-top:max(12px,env(safe-area-inset-top,0px))}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:18px}
ol.steps code{font-family:var(--f-num);font-size:16px;background:var(--sunk);padding:1px 6px;border-radius:6px}
.toggle{display:flex;align-items:center;gap:14px;font-size:19px;cursor:pointer;min-height:56px}
.toggle input{width:30px;height:30px;accent-color:var(--accent);flex:none}
.status{display:flex;flex-direction:column;gap:6px;font-size:18px}
.status b{font-weight:700}
.sync{font-size:14px;color:var(--muted);text-align:center}
.foot{display:flex;justify-content:center}
.notice{border:2px solid var(--accent);background:var(--accent-soft)}
.notice h2{font-size:22px}
.okline{font-size:16px;color:var(--ok);text-align:center}
.chip.none{background:var(--sunk);color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script>
(() => {
"use strict";
const SLOTS = [
  { id: "08", label: "Утро",  time: "8:00",  due: 8  },
  { id: "18", label: "Вечер", time: "18:00", due: 18 },
  { id: "22", label: "Ночь",  time: "22:00", due: 22 },
];
const MAX_FILL = 85, LATE_MIN = 45, BIG_LITERS = 8000, LOW_PCT = 20;

const S = {
  ready: false, loadErr: null, demo: false, lastSync: 0,
  stations: [], reports: [], deliveries: [],
  pin: lsGet("agzs.pin"), owner: false, settings: null, note: null,
  api: null, dev: null, vapid: null, push: "unsupported", installEvt: null,
  mode: "operator", view: "home", sid: lsGet("agzs.sid"), opSlot: null,
  detailSid: null, flash: null, form: {}, confirm: null, err: null, busy: false,
};

// ---------- helpers ----------
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function workDate(now = new Date()){ const d = new Date(now); if (d.getHours() < 4) d.setDate(d.getDate()-1); return dkey(d); }
function autoSlot(now = new Date()){ const h = now.getHours(); if (h < 4) return "22"; if (h < 13) return "08"; if (h < 20) return "18"; return "22"; }
function shiftDate(key, days){ const [y,m,d] = key.split("-").map(Number); const x = new Date(y, m-1, d); x.setDate(x.getDate()+days); return dkey(x); }
function parseDate(key){ const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); }
const fmt = (n, dec = 0) => Number.isFinite(n) ? n.toLocaleString("ru-RU", { maximumFractionDigits: dec }) : "—";
const parseNum = s => { if (s == null) return NaN; const t = String(s).replace(/[\s ]/g,"").replace(",","."); return t === "" ? NaN : Number(t); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLong = d => cap1(new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(d));
const dayShort = key => new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric",month:"short"}).format(parseDate(key));
const timeStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const slotOf = id => SLOTS.find(s => s.id === id);
function daysWord(n){ const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return "день"; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "дня"; return "дней"; }

// ---------- данные заправок (продажи и бочку считает сервер) ----------
/* ===== Логика смен: одинаковая на сервере и в приложении =====
 * Рабочие сутки идут с 8:00 до 8:00 следующего дня.
 * 18:00 и 22:00 — литры, проданные с 8:00 (после обнуления смены).
 * 8:00 — итог за прошедшие сутки (до обнуления), фактический остаток в бочке и деньги в кассе.
 */
var SLOT_RANK = { '18': 1, '22': 2, '08': 3 };
function addDays(key, n) {
  var p = key.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
}
/** К каким рабочим суткам относится сводка: утренняя закрывает вчерашние. */
function workDayOf(r) { return r.slot === '08' ? addDays(r.date, -1) : r.date; }
/** Раскладывает сводки одной заправки по суткам и считает продажи за каждый период. */
function shiftDays(reps) {
  var days = {};
  reps.forEach(function (r) { var d = workDayOf(r); (days[d] = days[d] || []).push(r); });
  Object.keys(days).forEach(function (d) {
    var prev = 0;
    days[d].sort(function (a, b) { return SLOT_RANK[a.slot] - SLOT_RANK[b.slot]; }).forEach(function (r) {
      r.day = d; r.sold = r.value - prev; prev = r.value;
    });
  });
  return days;
}
function dayCum(list) { return list && list.length ? list[list.length - 1].value : 0; }
/** Остаток в бочке: последняя известная точка (утренний замер оператора или ввод владельца)
 *  плюс привозы после неё минус продажи после неё. */
function tankEstimate(st, reps, dels, days, dayOfMs, cutAt, upToDay) {
  var base = { level: st.baseLevel, at: st.baseAt, day: dayOfMs(st.baseAt), cum0: st.baseCum || 0, kind: 'owner' };
  reps.forEach(function (r) {
    if (r.slot === '08' && r.tank != null && r.at < cutAt && r.at > base.at) base = { level: r.tank, at: r.at, day: r.date, cum0: 0, kind: 'operator' };
  });
  var v = base.level;
  dels.forEach(function (d) { if (d.at > base.at && d.at <= cutAt) v += d.liters; });
  Object.keys(days).forEach(function (d) {
    if (d < base.day || d > upToDay) return;
    var c = dayCum(days[d]);
    v -= d === base.day ? Math.max(0, c - base.cum0) : c;
  });
  return { value: v, base: base };
}
/** Пересчитывает всё по заправке: продажи по периодам, остаток сейчас и расчётный остаток к каждому утру. */
function computeStation(st, reps, dels, dayOfMs) {
  var days = shiftDays(reps);
  var now = tankEstimate(st, reps, dels, days, dayOfMs, Infinity, '9999-12-31');
  st.tank = now.value;
  st.tankFrom = now.base.kind;
  st.tankAt = now.base.at;
  reps.forEach(function (r) {
    if (r.slot === '08') {
      r.expected = tankEstimate(st, reps, dels, days, dayOfMs, r.at, r.day).value;
      r.diff = r.tank != null ? r.tank - r.expected : null;
    }
  });
  return days;
}
/** Границы для нового значения литров в сводке: не меньше предыдущей за те же сутки, не больше следующей. */
function shiftBounds(reps, date, slot) {
  var probe = { date: date, slot: slot }, day = workDayOf(probe), rank = SLOT_RANK[slot];
  var lo = 0, hi = null, loSlot = null, hiSlot = null;
  reps.forEach(function (r) {
    if (workDayOf(r) !== day || r.slot === slot) return;
    if (SLOT_RANK[r.slot] < rank && r.value >= lo) { lo = r.value; loSlot = r.slot; }
    if (SLOT_RANK[r.slot] > rank && (hi == null || r.value < hi)) { hi = r.value; hiSlot = r.slot; }
  });
  return { lo: lo, hi: hi, loSlot: loSlot, hiSlot: hiSlot, day: day };
}

function stReports(sid){ return S.reports.filter(r => r.sid === sid); }
const curWorkDay = () => dkey(new Date(Date.now() - 8 * 3600000));   // смена идёт с 8:00 до 8:00
function findRep(sid, date, slot){ return S.reports.find(r => r.sid === sid && r.date === date && r.slot === slot); }
/** Литры текущей смены (с 8:00) — по последней сводке этих суток. */
function cumNow(sid){
  const d = curWorkDay(); let best = null;
  for (const r of stReports(sid)) if ((r.day || workDayOf(r)) === d && (!best || SLOT_RANK[r.slot] > SLOT_RANK[best.slot])) best = r;
  return best ? best.value : 0;
}
/** Средние продажи в сутки — по утренним итогам за последнюю неделю. */
function avgDaily(sid){
  const from = shiftDate(workDate(), -7);
  const v = stReports(sid).filter(r => r.slot === "08" && r.date >= from).map(r => r.value);
  return v.length ? v.reduce((a,b) => a + b, 0) / v.length : null;
}
function slotState(sid, date, slot){
  const r = S.reports.find(x => x.sid === sid && x.date === date && x.slot === slot.id);
  if (r) return { st: "ok", r };
  const due = parseDate(date); due.setHours(slot.due, 0, 0, 0);
  const now = Date.now();
  const stn = S.stations.find(x => x.id === sid);
  if (stn && stn.createdAt && stn.createdAt > due.getTime()) return { st: "none" };
  if (now < due.getTime()) return { st: "wait" };
  if (now < due.getTime() + LATE_MIN*60000) return { st: "soon" };
  return { st: "late" };
}

// ---------- сервер ----------
const ARGS = {
  getState: () => ({}), submitReport: p => ({ p }), addDelivery: p => ({ p }),
  ownerLogin: pin => ({ pin }), getSettings: pin => ({ pin }), setEmail: (pin, on) => ({ pin, on }),
  addStation: (pin, p) => ({ pin, p }), updateStation: (pin, p) => ({ pin, p }), fixTank: (pin, p) => ({ pin, p }),
  deleteStation: (pin, id) => ({ pin, id }), deleteDelivery: (pin, id) => ({ pin, id }),
  subscribe: o => o, testPush: (pin, dev) => ({ pin, dev }),
};
async function call(fn, ...args){
  if (S.demo) return Demo.call(fn, args);
  const body = JSON.stringify({ a: fn, ...ARGS[fn](...args) });
  let r;
  try { r = await fetch(S.api, { method: "POST", body, redirect: "follow" }); }
  catch(e){ throw new Error("Нет связи. Проверьте интернет и нажмите ещё раз."); }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!j) throw new Error("Сервер не ответил. Проверьте адрес сервера или попробуйте позже.");

const API_BASE = "https://script.google.com/macros/s/";
// Адрес вашего сервера Apps Script: с ним приложение не спрашивает ссылку при входе.
const DEFAULT_SERVER = "AKfycbyYho4BrDQVb6qcv0gzuYXuWrdWey_vhhjOkdeeiVCKD4jMGXhvPiFDKrtJUrnXgbQD";

function idFromInput(v){

  if (m) return m[1];

}
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function b64ToBytes(b){ const p = "=".repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(r, c => c.charCodeAt(0)); }

let swReg = null;
async function registerSW(){
  if (!("serviceWorker" in navigator) || S.demo) return;
  try {
    const reg = await navigator.serviceWorker.register("sw.js?api=" + encodeURIComponent(S.api) + "&dev=" + encodeURIComponent(S.dev), { scope: "./" });
    // нужен активный помощник, чтобы подписка сработала сразу по нажатию
    swReg = await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(reg), 8000))]);
  } catch(e){ swReg = null; }
}
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function pushStatus(){
  if (S.demo) return "default";
  if (IOS && !STANDALONE) return "ios-home";
  if (!pushSupported() || !swReg) return "unsupported";
  return Notification.permission === "granted" ? "on" : Notification.permission;
}
/** Подписывает телефон и сообщает серверу, кому он принадлежит. ask=true — спросить разрешение. */
function syncPush(ask){
  if (S.demo){ S.push = "on"; return Promise.resolve(); }
  if (IOS && !STANDALONE){ S.push = "ios-home"; return Promise.resolve(); }
  if (!pushSupported() || !swReg || !S.vapid){ S.push = "unsupported"; return Promise.resolve(); }
  if (!ask && Notification.permission !== "granted"){ S.push = Notification.permission; return Promise.resolve(); }
  const opts = { userVisibleOnly: true, applicationServerKey: b64ToBytes(S.vapid) };
  // Safari требует вызвать subscribe() сразу в обработчике нажатия, без ожиданий перед ним.
  const first = ask ? swReg.pushManager.subscribe(opts) : null;
  return (async () => {
    let sub = null;
    try { sub = first ? await first : await swReg.pushManager.getSubscription(); }
    catch(e){
      if (Notification.permission === "denied"){ S.push = "denied"; return; }
      sub = await swReg.pushManager.getSubscription();       // подписка со старым ключом мешает новой
      if (!sub) throw e;
    }
    if (Notification.permission !== "granted"){ S.push = Notification.permission; return; }
    if (sub && !sameKey(sub.options && sub.options.applicationServerKey, S.vapid)){ await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await swReg.pushManager.subscribe(opts);
    await call("subscribe", { dev: S.dev, sub: sub.toJSON(), sid: S.sid || "", owner: S.owner, pin: S.owner ? S.pin : "" });
    S.push = "on";
  })();
}

const Demo = {
  st: [], rep: [], del: [],
  seed(){
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const now = new Date(), today = curWorkDay(), start = parseDate(shiftDate(today, -8)).getTime() + 9*3600000;
    this.st = [
      { id: "d1", name: "Промка (пример)", capacity: 10000, baseLevel: 9000, baseAt: start, baseCum: 0, createdAt: start },
      { id: "d2", name: "У трассы (пример)", capacity: 20000, baseLevel: 17000, baseAt: start, baseCum: 0, createdAt: start + 1 },
    ];
    this.del.push({ id: "v1", sid: "d1", liters: 5000, at: parseDate(shiftDate(today, -4)).getTime() + 14*3600000 });
    for (const st of this.st){
      for (let i = 7; i >= 0; i--){
        const d = shiftDate(today, -i), next = shiftDate(d, 1), t0 = parseDate(d).getTime();
        const c18 = Math.round(500 + rnd() * 300), c22 = c18 + Math.round(200 + rnd() * 150), tot = c22 + Math.round(100 + rnd() * 150);
        const push = (date, slot, value, at, extra) => { if (at < Date.now()) this.rep.push({ key: `${date}_${slot}`, sid: st.id, date, slot, value, at, ...extra }); };
        push(d, "18", c18, t0 + 18*3600000 + 300000);
        push(d, "22", c22, t0 + 22*3600000 + 300000);
        if (!(i === 1 && st.id === "d2")) push(next, "08", tot, t0 + 32*3600000 + 300000, { tank: null, cash: Math.round(30000 + rnd() * 40000) });
      }
      // фактический остаток утром — расчётный плюс небольшая погрешность
      this.rep.filter(r => r.sid === st.id && r.slot === "08").sort((a,b) => a.at - b.at).forEach(r => {
        const s = this.state().stations.find(x => x.id === st.id), m = this.state().reports.find(x => x.key === r.key && x.sid === st.id);
        r.tank = Math.round(m.expected + (rnd() - 0.6) * 80);
      });
    }
  },
  state(){
    const st = this.st.map(s => ({ ...s })), rep = this.rep.map(r => ({ ...r }));
    for (const s of st) computeStation(s, rep.filter(r => r.sid === s.id), this.del.filter(d => d.sid === s.id), ms => dkey(new Date(ms - 8*3600000)));
    return { stations: st, reports: rep, deliveries: this.del.slice() };
  },
  async call(fn, a){
    await new Promise(r => setTimeout(r, 250));
    const settings = { email: "example@gmail.com", emailOn: true, ownerPhones: 1, phones: this.st.map((s,i) => ({ name: s.name, count: i ? 0 : 2 })), sheetUrl: "", defaultPin: false };
    switch (fn){
      case "getState": return this.state();
      case "submitReport": { const p = a[0]; const key = `${p.date}_${p.slot}`; this.rep = this.rep.filter(r => !(r.sid === p.sid && r.key === key)); this.rep.push({ key, sid: p.sid, date: p.date, slot: p.slot, value: p.liters, tank: p.tank, cash: p.cash, at: Date.now() }); return this.state(); }
      case "addDelivery": this.del.push({ id: "v" + Date.now(), sid: a[0].sid, liters: a[0].liters, at: Date.now() }); return this.state();
      case "ownerLogin": case "getSettings": case "setEmail": return settings;
      case "addStation": { const p = a[1], t = Date.now(); this.st.push({ id: "d" + t, name: p.name, capacity: p.capacity, baseLevel: p.level, baseAt: t, baseCum: p.sold || 0, createdAt: t }); return this.state(); }
      case "updateStation": { const s = this.st.find(x => x.id === a[1].id); Object.assign(s, { name: a[1].name, capacity: a[1].capacity }); return this.state(); }
      case "fixTank": { const o = this.st.find(x => x.id === a[1].id); Object.assign(o, { baseLevel: a[1].level, baseAt: Date.now(), baseCum: cumNow(o.id) }); return this.state(); }
      case "deleteStation": this.st = this.st.filter(x => x.id !== a[1]); return this.state();
      case "deleteDelivery": this.del = this.del.filter(x => x.id !== a[1]); return this.state();
      case "subscribe": return { ok: true };
      case "testPush": return "В примере уведомления не отправляются.";
      default: throw new Error("В примере это недоступно.");
    }
  },
};

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has("demo")){ S.demo = true; Demo.seed(); S.pin = "demo"; S.api = "demo"; }
  else {
    const fromLink = idFromInput(q.get("s"));
    if (fromLink) lsSet("agzs.api", fromLink);
    if (q.has("s")) history.replaceState(null, "", location.pathname);
    const saved = lsGet("agzs.api");
    const id = saved || DEFAULT_SERVER; S.api = id ? apiFromId(id) : null;
    S.usingDefault = !saved && !!DEFAULT_SERVER;
  }
  S.dev = lsGet("agzs.dev");
  if (!S.dev){ S.dev = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^\w-]/g, ""); lsSet("agzs.dev", S.dev); }
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; render(); });
  window.addEventListener("appinstalled", () => { S.installEvt = null; render(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => { if (e.data === "refresh") refresh(); });
  render();
  if (!S.api) return;
  await registerSW();
  S.push = pushStatus();
  if (S.pin){
    try { S.settings = await call("ownerLogin", S.pin); S.owner = true; S.mode = "owner"; }
    catch(e){ if (/PIN/.test(errText(e))){ S.pin = null; lsSet("agzs.pin", null); } }
  }
  await refresh();
  if (!S.ready && S.usingDefault){ S.api = null; S.loadErr = null; render(); return; }   // встроенный адрес не ответил — спросим вручную
  if (S.push === "on") quietSync();
})();
})();
</script>
