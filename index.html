<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сводки АГЗС</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Сводки АГЗС — тёмная тема с красным акцентом (по референсу владельца).
   Сетка: одна колонка шириной с телефон; сверху фото заправки под шапкой; снизу меню владельца. */
:root{
  --bg:#0A0C0F; --surface:#15181D; --surface-2:#1C2026; --sunk:#0F1216; --line:#272C34;
  --ink:#F3F5F8; --muted:#98A2AE; --accent:#E8372C; --accent-2:#FF5A3C; --accent-ink:#FFFFFF; --accent-soft:rgba(232,55,44,.16);
  --ok:#3DD46F; --ok-bg:rgba(61,212,111,.14); --warn:#F5C542; --warn-bg:rgba(245,197,66,.14); --bad:#FF5B4F; --bad-bg:rgba(255,91,79,.15);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body.has-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative}
h1,h2,h3{margin:0;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- фото сверху ---------- */
.hero-bg{position:absolute;z-index:0;top:calc(-1 * max(12px,env(safe-area-inset-top,0px)));left:calc(-1 * var(--gut));right:calc(-1 * var(--gut));height:360px;
  background:url(hero.jpg) center 40%/cover no-repeat;pointer-events:none}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,15,.78) 0%,rgba(10,12,15,.25) 30%,rgba(10,12,15,.35) 62%,var(--bg) 100%)}
.hero-bg.short{height:250px}
#app > *{position:relative;z-index:1}
#app > .hero-bg{position:absolute;z-index:0}
.hero-title{margin-top:96px;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero-title .d{font-size:18px;color:#D9DEE5}
.hero-title h1{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.hero-title.short{margin-top:40px}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .flame{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:22px;font-weight:700;line-height:1.1}
.brand span{display:block;font-size:14px;color:#C9D0D8}
.head-btns{display:flex;gap:6px}
.icon-btn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink);font-size:24px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.seg{display:inline-flex;align-self:flex-start;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:9px 20px;border-radius:11px;font-size:17px;font-weight:500;color:#D2D8DF;cursor:pointer;min-height:42px}
.seg button[aria-pressed="true"]{background:#F3F5F8;color:#0A0C0F;font-weight:700}
.banner{border-radius:14px;padding:12px 16px;background:var(--warn-bg);color:var(--warn);font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- карточки ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.card-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.card-h svg.i{font-size:26px;color:var(--muted)}
.label{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.hint{font-size:16px;color:var(--muted)}
.big{font-size:40px;font-weight:700;line-height:1.1}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.empty{text-align:center;align-items:center;padding-block:28px}

/* плитки */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;min-width:0}
.tile > svg.i{font-size:30px;color:#C9D0D8;margin-top:2px}
.tile .k{font-size:15px;color:#C9D0D8}
.tile .v{font-size:30px;font-weight:700;line-height:1.15}
.tile .v.bad{color:var(--bad)}
.tile .cmp{font-size:14px;color:var(--muted)}
.up{color:var(--ok);font-weight:600} .down{color:var(--bad);font-weight:600}
.okmark{width:28px;height:28px;border-radius:50%;border:2px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:16px;margin-top:6px}
.rev{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.rev > svg.i{font-size:36px;color:#C9D0D8}
.rev .v{font-size:32px;font-weight:700;line-height:1.1}
.rev .spark{width:120px;height:52px}
.rev-note{font-size:15px;color:var(--muted)}

/* остатки */
.tanks{display:flex;flex-direction:column}
.tank-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.tank-row:first-child{border-top:0;padding-top:4px}
.tank-ico{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:26px;color:#C9D0D8}
.tank-mid{display:flex;flex-direction:column;gap:8px;min-width:0}
.tank-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tank-top b{font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tank-top .pct{font-size:18px;font-weight:700;white-space:nowrap}
.tank-l{font-size:15px;color:var(--muted)}
.chev{font-size:22px;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}

/* шкала бочки (крупная) */
.gauge-wrap{padding-bottom:22px}
.gauge{position:relative;height:26px;background:var(--surface-2);border-radius:10px;border:1px solid var(--line)}
.gauge.sm{height:14px}
.gauge-fill{position:absolute;inset:0 auto 0 0;border-radius:9px}
.gauge-max{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--muted)}
.gauge-max span{position:absolute;top:100%;transform:translateX(-50%);font-size:13px;color:var(--muted);white-space:nowrap;padding-top:4px}
.tank-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tank-num .of{font-size:17px;color:var(--muted)}
.tank-line{font-size:16px;color:var(--muted)} .tank-line b{color:var(--ink)}

/* статусы сводок */
.st-rows{display:flex;flex-direction:column;gap:12px}
.st-r{display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%}
.st-r b{font-size:18px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border-radius:10px;padding:7px 3px;text-align:center;font-size:13px;line-height:1.25;min-width:0;background:var(--surface-2);color:var(--muted)}
.chip b{display:block;font-size:15px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.soon{background:var(--warn-bg);color:var(--warn)}
.chip.late{background:var(--bad-bg);color:var(--bad)} .chip.none,.chip.wait{background:var(--surface-2);color:var(--muted)}

/* список заправок */
.st-card{text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit}
.st-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.st-name{font-size:22px;font-weight:700;min-width:0}
.st-total{font-size:20px;font-weight:700}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--bad-bg);color:var(--bad)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.sum .v{font-size:28px;font-weight:700;line-height:1.15}
.sum .v.bad{color:var(--bad)} .sum .v.ok{color:var(--ok)}

/* кнопки */
.btn{border:0;border-radius:16px;min-height:64px;padding:14px 20px;font-size:21px;font-weight:700;cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;text-decoration:none;box-sizing:border-box}
.btn svg.i{font-size:26px}
.btn-main{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:0 8px 24px rgba(232,55,44,.35)}
.btn-main:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-ok{background:var(--ok);color:#06210F}
.btn-danger{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.link{border:0;background:none;color:#FF8A7A;font-size:17px;font-weight:500;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;min-height:44px}
.back{align-self:flex-start}
.mini{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;min-height:40px}
.mini.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.foot{display:flex;justify-content:center}

/* формы */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:19px;font-weight:700}
.txt{width:100%;box-sizing:border-box;font-size:21px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);min-height:58px;color:var(--ink)}
.meter{width:100%;box-sizing:border-box;font-size:40px;font-weight:700;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  padding:14px 10px;border-radius:16px;border:2px solid #3A414B;background:var(--sunk);color:var(--ink)}
.meter:focus{border-color:var(--accent-2)}
.meter::placeholder,.txt::placeholder{color:#59616C}
.prev{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:17px;color:var(--muted)}
.prev .num{color:var(--ink);font-weight:700}
.calc{border-radius:14px;padding:14px 16px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc .v{font-size:28px;font-weight:700}
.calc.ok{background:var(--ok-bg)} .calc.ok .v{color:var(--ok)}
.msg{border-radius:14px;padding:14px 16px;font-size:18px;font-weight:500}
.msg.bad{background:var(--bad-bg);color:#FFB3AC} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:#9BF0B7}
.msg.info{background:var(--accent-soft);color:var(--ink)}
.toggle{display:flex;align-items:center;gap:14px;font-size:18px;cursor:pointer;min-height:56px}
.toggle input{width:28px;height:28px;accent-color:var(--accent);flex:none}
.status{display:flex;flex-direction:column;gap:6px;font-size:17px}
.status b{font-weight:700}
.sync{font-size:14px;color:var(--muted);text-align:center}
.notice{border:1px solid rgba(232,55,44,.5);background:linear-gradient(180deg,rgba(232,55,44,.14),rgba(232,55,44,.06))}
.notice h2{font-size:21px}
.okline{font-size:15px;color:var(--ok);text-align:center}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:17px}

/* выбор смены */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 2px;min-height:90px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;color:var(--ink)}
.slot b{font-size:19px} .slot span{font-size:16px;color:var(--muted)}
.slot em{font-style:normal;font-size:13px;font-weight:700;color:var(--ok);margin-top:2px}
.slot[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent-2)}
.picker{display:flex;flex-direction:column;gap:12px}
.picker .btn{justify-content:flex-start;text-align:left;font-size:23px;min-height:76px}

/* готово */
.done{align-items:center;text-align:center;padding-block:32px}
.check{width:116px;height:116px;border-radius:50%;background:var(--ok);display:grid;place-items:center;box-shadow:0 0 40px rgba(61,212,111,.35)}
.check svg{width:62px;height:62px}
@media (prefers-reduced-motion: no-preference){.check{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}

/* таблицы и списки */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums} td.miss{color:var(--bad)} td.tot{font-weight:700}
.list{display:flex;flex-direction:column}
.list > div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;flex-wrap:wrap}
.list > div:last-child{border-bottom:0}

/* аналитика */
.an-seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.an-seg button{border:0;background:transparent;color:var(--muted);border-radius:10px;min-height:44px;font-size:17px;font-weight:600;cursor:pointer}
.an-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -2px}
.fchips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer;min-height:40px}
.fchips button[aria-pressed="true"]{border-color:var(--accent-2);background:var(--accent-soft)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.kv{display:flex;flex-direction:column}
.kv > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.kv > div:first-child{border-top:0}
.kv span{color:var(--muted);font-size:17px}
.kv b{font-size:21px;text-align:right}
.kv small{display:block;font-size:14px;font-weight:600;text-align:right}

/* нижнее меню владельца */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,20,24,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;min-height:58px;cursor:pointer;border-radius:12px}
.nav button svg.i{font-size:27px}
.nav button[aria-current="page"]{color:var(--accent-2)}

</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script>
(() => {
"use strict";
const SLOTS = [
  { id: "08", label: "Утро",  time: "8:00",  due: 8  },
  { id: "14", label: "День",  time: "14:00", due: 14 },
  { id: "18", label: "Вечер", time: "18:00", due: 18 },
  { id: "22", label: "Ночь",  time: "22:00", due: 22 },
];
const MAX_FILL = 85, LATE_MIN = 45, BIG_LITERS = 8000, LOW_PCT = 20;

const S = {
  ready: false, loadErr: null, demo: false, lastSync: 0,
  stations: [], reports: [], deliveries: [],
  pin: lsGet("agzs.pin"), owner: false, settings: null, note: null,
  tok: lsGet("agzs.tok"), devices: [], revoked: false, opl: { step: "code", code: "", stations: [] },
  api: null, dev: null, vapid: null, push: "unsupported", installEvt: null,
  mode: "operator", view: "home", sid: lsGet("agzs.sid"), opSlot: null,
  detailSid: null, flash: null, form: {}, confirm: null, err: null, busy: false,
};

// ---------- helpers ----------
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} }
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function workDate(now = new Date()){ const d = new Date(now); if (d.getHours() < 4) d.setDate(d.getDate()-1); return dkey(d); }
function autoSlot(now = new Date()){ const h = now.getHours(); if (h < 4) return "22"; if (h < 11) return "08"; if (h < 16) return "14"; if (h < 20) return "18"; return "22"; }
function shiftDate(key, days){ const [y,m,d] = key.split("-").map(Number); const x = new Date(y, m-1, d); x.setDate(x.getDate()+days); return dkey(x); }
function parseDate(key){ const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); }
const fmt = (n, dec = 0) => Number.isFinite(n) ? n.toLocaleString("ru-RU", { maximumFractionDigits: dec }) : "—";
const parseNum = s => { if (s == null) return NaN; const t = String(s).replace(/[\s ]/g,"").replace(",","."); return t === "" ? NaN : Number(t); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLong = d => cap1(new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(d));
const dayShort = key => new Intl.DateTimeFormat("ru-RU",{weekday:"short",day:"numeric",month:"short"}).format(parseDate(key));
const timeStr = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const slotOf = id => SLOTS.find(s => s.id === id);
function daysWord(n){ const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return "день"; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "дня"; return "дней"; }

// ---------- данные заправок (продажи и бочку считает сервер) ----------
/* ===== Логика смен: одинаковая на сервере и в приложении =====
 * Рабочие сутки идут с 8:00 до 8:00 следующего дня.
 * 14:00, 18:00 и 22:00 — литры, проданные с 8:00 (после обнуления смены).
 * 8:00 — итог за прошедшие сутки (до обнуления), фактический остаток в бочке и деньги в кассе.
 */

/** К каким рабочим суткам относится сводка: утренняя закрывает вчерашние. */
function workDayOf(r) { return r.slot === '08' ? addDays(r.date, -1) : r.date; }
/** Раскладывает сводки одной заправки по суткам и считает продажи за каждый период. */
function shiftDays(reps) {
  var days = {};
  reps.forEach(function (r) { var d = workDayOf(r); (days[d] = days[d] || []).push(r); });
  Object.keys(days).forEach(function (d) {
    var prev = 0;
    days[d].sort(function (a, b) { return SLOT_RANK[a.slot] - SLOT_RANK[b.slot]; }).forEach(function (r) {
      r.day = d; r.sold = r.value - prev; prev = r.value;

}
function dayCum(list) { return list && list.length ? list[list.length - 1].value : 0; }
/** Остаток в бочке: последняя известная точка (утренний замер оператора или ввод владельца)

function tankEstimate(st, reps, dels, days, dayOfMs, cutAt, upToDay) {
  var base = { level: st.baseLevel, at: st.baseAt, day: dayOfMs(st.baseAt), cum0: st.baseCum || 0, kind: 'owner' };
  reps.forEach(function (r) {
    if (r.slot === '08' && r.tank != null && r.at < cutAt && r.at > base.at) base = { level: r.tank, at: r.at, day: r.date, cum0: 0, kind: 'operator' };
  });
  var v = base.level;
  dels.forEach(function (d) { if (d.at > base.at && d.at <= cutAt) v += d.liters; });
  Object.keys(days).forEach(function (d) {
    if (d < base.day || d > upToDay) return;

/** Пересчитывает всё по заправке: продажи по периодам, остаток сейчас и расчётный остаток к каждому утру. */

  var days = shiftDays(reps);
  var now = tankEstimate(st, reps, dels, days, dayOfMs, Infinity, '9999-12-31');
  st.tank = now.value;
  st.tankFrom = now.base.kind;
  st.tankAt = now.base.at;
  reps.forEach(function (r) {
    if (r.slot === '08') {
      r.expected = tankEstimate(st, reps, dels, days, dayOfMs, r.at, r.day).value;

  var probe = { date: date, slot: slot }, day = workDayOf(probe), rank = SLOT_RANK[slot];
  var lo = 0, hi = null, loSlot = null, hiSlot = null;
  reps.forEach(function (r) {
    if (workDayOf(r) !== day || r.slot === slot) return;
    if (SLOT_RANK[r.slot] < rank && r.value >= lo) { lo = r.value; loSlot = r.slot; }
    if (SLOT_RANK[r.slot] > rank && (hi == null || r.value < hi)) { hi = r.value; hiSlot = r.slot; }
  });
  return { lo: lo, hi: hi, loSlot: loSlot, hiSlot: hiSlot, day: day };
}

function stReports(sid){ return S.reports.filter(r => r.sid === sid); }
const curWorkDay = () => dkey(new Date(Date.now() - 8 * 3600000));   // смена идёт с 8:00 до 8:00
function findRep(sid, date, slot){ return S.reports.find(r => r.sid === sid && r.date === date && r.slot === slot); }
/** Литры текущей смены (с 8:00) — по последней сводке этих суток. */
function cumNow(sid){
  const d = curWorkDay(); let best = null;
  for (const r of stReports(sid)) if ((r.day || workDayOf(r)) === d && (!best || SLOT_RANK[r.slot] > SLOT_RANK[best.slot])) best = r;
  return best ? best.value : 0;
}
/** Средние продажи в сутки — по утренним итогам за последнюю неделю. */
function avgDaily(sid){
  const from = shiftDate(workDate(), -7);
  const v = stReports(sid).filter(r => r.slot === "08" && r.date >= from).map(r => r.value);
  return v.length ? v.reduce((a,b) => a + b, 0) / v.length : null;
}
function slotState(sid, date, slot){
  const r = S.reports.find(x => x.sid === sid && x.date === date && x.slot === slot.id);
  if (r) return { st: "ok", r };
  const due = parseDate(date); due.setHours(slot.due, 0, 0, 0);
  const now = Date.now();
  const stn = S.stations.find(x => x.id === sid);
  if (stn && stn.createdAt && stn.createdAt > due.getTime()) return { st: "none" };
  if (now < due.getTime()) return { st: "wait" };
  if (now < due.getTime() + LATE_MIN*60000) return { st: "soon" };
  return { st: "late" };

async function call(fn, ...args){
  if (S.demo) return Demo.call(fn, args);

  const body = JSON.stringify({ a: fn, dev: S.dev, tok: S.tok, ...extra, ...ARGS[fn](...args) });

  catch(e){ throw new Error("Нет связи. Проверьте интернет и нажмите ещё раз."); }
  let j = null; try { j = await r.json(); } catch(e){}
  if (!j) throw new Error("Сервер не ответил. Проверьте адрес сервера или попробуйте позже.");

      setTok(null); S.ready = false;
      if (j.error === "REVOKED") S.revoked = true;
      const e = new Error(j.error === "REVOKED" ? "Владелец отключил этот телефон от приложения." : "Нужно войти заново."); e.code = j.error; throw e;

  if (!pushSupported() || !swReg) return "unsupported";
  return Notification.permission === "granted" ? "on" : Notification.permission;
}
/** Подписывает телефон и сообщает серверу, кому он принадлежит. ask=true — спросить разрешение. */
function syncPush(ask){
  if (S.demo){ S.push = "on"; return Promise.resolve(); }
  if (IOS && !STANDALONE){ S.push = "ios-home"; return Promise.resolve(); }
  if (!pushSupported() || !swReg || !S.vapid){ S.push = "unsupported"; return Promise.resolve(); }
  if (!ask && Notification.permission !== "granted"){ S.push = Notification.permission; return Promise.resolve(); }
  const opts = { userVisibleOnly: true, applicationServerKey: b64ToBytes(S.vapid) };
  // Safari требует вызвать subscribe() сразу в обработчике нажатия, без ожиданий перед ним.
  const first = ask ? swReg.pushManager.subscribe(opts) : null;
  return (async () => {
    let sub = null;
    try { sub = first ? await first : await swReg.pushManager.getSubscription(); }
    catch(e){
      if (Notification.permission === "denied"){ S.push = "denied"; return; }
      sub = await swReg.pushManager.getSubscription();       // подписка со старым ключом мешает новой
      if (!sub) throw e;
    }
    if (Notification.permission !== "granted"){ S.push = Notification.permission; return; }
    if (sub && !sameKey(sub.options && sub.options.applicationServerKey, S.vapid)){ await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await swReg.pushManager.subscribe(opts);
    await call("subscribe", { sub: sub.toJSON() });

  })();
}

/** Цвет уровня: тёмно-красный у дна → жёлтый к 30 % → ярко-зелёный к 100 %. */

/* ---------- расчёты для сводки и аналитики ---------- */
/** Литры за рабочие сутки: утренний итог следующего дня, а пока его нет — последняя сводка этих суток. */
function dayLiters(sid, day){
  const m = findRep(sid, shiftDate(day, 1), "08");
  if (m) return { v: m.value, closed: true };
  let best = null;
  for (const r of stReports(sid)) if (r.slot !== "08" && r.date === day && (!best || SLOT_RANK[r.slot] > SLOT_RANK[best.slot])) best = r;
  return best ? { v: best.value, closed: false } : null;
}
const priceOf = st => Number(st && st.price) > 0 ? Number(st.price) : null;
const hasPrices = () => S.stations.some(priceOf);
/** Сегодня с 8:00 против вчера к тому же часу (по последней сводке каждой заправки). */
function todayVsYesterday(){
  const today = curWorkDay(), yday = shiftDate(today, -1);
  let lt = 0, ly = 0, rt = 0, ry = 0, cmp = false;
  for (const st of S.stations){
    let best = null;
    for (const r of stReports(st.id)) if (r.slot !== "08" && r.date === today && (!best || SLOT_RANK[r.slot] > SLOT_RANK[best.slot])) best = r;
    const p = priceOf(st) || 0;
    if (!best) continue;
    lt += best.value; rt += best.value * p;
    const y = findRep(st.id, yday, best.slot);
    if (y){ ly += y.value; ry += y.value * p; cmp = true; }
  }
  return { lt, rt, dl: cmp && ly ? (lt / ly - 1) * 100 : null, dr: cmp && ry ? (rt / ry - 1) * 100 : null };
}
function deltaHtml(d, tail){
  if (d == null || !isFinite(d)) return "";
  const r = Math.round(d);
  return `<span class="${r >= 0 ? "up" : "down"}">${r > 0 ? "+" : r < 0 ? "−" : ""}${fmt(Math.abs(r))} %</span>${tail ? ` <span class="cmp">${tail}</span>` : ""}`;
}
function sparkline(vals){
  const v = vals.filter(x => x != null);
  if (v.length < 2) return "";
  const W = 120, H = 52, max = Math.max(...v), min = Math.min(...v), span = max - min || 1;
  const pts = vals.map((x, i) => x == null ? null : [i / (vals.length - 1) * (W - 6) + 3, H - 6 - (x - min) / span * (H - 14)]).filter(Boolean);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DD46F" stop-opacity=".35"/><stop offset="1" stop-color="#3DD46F" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#sg)" points="${pts[0][0].toFixed(1)},${H} ${line} ${last[0].toFixed(1)},${H}"/>
    <polyline fill="none" stroke="#3DD46F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="#3DD46F"/></svg>`;
}
/** Литры и выручка сети по закрытым суткам за последние n дней (для графика). */
function networkDays(n, sid){
  const today = curWorkDay(), out = [];
  for (let i = n - 1; i >= 0; i--){
    const d = shiftDate(today, -i); let l = 0, r = 0, any = false;
    for (const st of S.stations){
      if (sid && st.id !== sid) continue;
      const x = dayLiters(st.id, d);
      if (x){ any = true; l += x.v; r += x.v * (priceOf(st) || 0); }
    }
    out.push({ d, l: any ? l : null, r: any ? r : null, today: i === 0 });
  }
  return out;
}

        ${anyCash ? `<div class="rev-note">Касса утром на всех заправках: <b class="num">${fmt(cash)} ₽</b></div>` : ""}</div>`;
  return `${hero}${warn}

function analyticsView(){
  const per = S.anPer || "week", sid = S.anSid || null;
  const st = sid ? S.stations.find(x => x.id === sid) : null;
  const stList = st ? [st] : S.stations;
  const pr = x => (st ? priceOf(st) : null);
  let bars = [], labels = [], title = "";
  let curL = 0, curR = 0, prevL = null, prevR = null, nDays = 0;
  if (per === "day"){
    const d = curWorkDay(), parts = [["14","8–14"],["18","14–18"],["22","18–22"],["08","22–8"]];
    title = "Сегодня по сменам, литры";
    for (const [slot, lab] of parts){
      let v = 0, any = false;
      for (const s2 of stList){
        const r = slot === "08" ? findRep(s2.id, shiftDate(d, 1), "08") : findRep(s2.id, d, slot);
        if (r && r.sold != null){ v += r.sold; any = true; curR += r.sold * (priceOf(s2) || 0); }
      }
      bars.push(any ? v : null); labels.push(lab); if (any) curL += v;
    }
    const y = shiftDate(d, -1); prevL = 0; prevR = 0; let anyY = false;
    for (const s2 of stList){ const x = dayLiters(s2.id, y); if (x){ anyY = true; } }
    // сравнение со вчера к тому же часу
    const c = st ? null : todayVsYesterday();
    if (c){ prevL = c.dl; prevR = c.dr; } else { prevL = null; prevR = null; }
    nDays = 1;
  } else {
    const n = per === "week" ? 7 : 30;
    title = per === "week" ? "Последние 7 суток, литры" : "Последние 30 суток, литры";
    const cur = networkDays(n, sid), prev = networkDays(2 * n, sid).slice(0, n);
    cur.forEach(x => { bars.push(x.l); labels.push(x.d); if (x.l != null){ curL += x.l; curR += x.r; nDays++; } });
    const pl = prev.filter(x => x.l != null);
    if (pl.length >= Math.max(1, nDays * 0.7)){ const sl = pl.reduce((a, x) => a + x.l, 0), sr = pl.reduce((a, x) => a + x.r, 0); prevL = sl ? (curL / sl - 1) * 100 : null; prevR = sr ? (curR / sr - 1) * 100 : null; }
  }
  // график
  const W = 340, H = 180, padB = 26, padT = 18, n = bars.length, gap = n > 10 ? 3 : 10;
  const bw = (W - gap * (n - 1)) / n, max = Math.max(1, ...bars.filter(v => v != null));
  const svgBars = bars.map((v, i) => {
    const x = i * (bw + gap), h = v == null ? 0 : Math.max(2, v / max * (H - padB - padT)), y = H - padB - h;
    const lab = per === "day" ? labels[i] : per === "week" ? new Intl.DateTimeFormat("ru-RU", { weekday: "short" }).format(parseDate(labels[i])) : (i % 5 === 4 || i === n - 1 ? String(parseDate(labels[i]).getDate()) : "");
    const isToday = per !== "day" && i === n - 1;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, bw / 3).toFixed(1)}" fill="${isToday ? "#7A2A26" : "#E8372C"}"/>
      ${v != null && n <= 10 ? `<text class="vl" x="${(x + bw / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle">${fmt(v)}</text>` : ""}
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
  }).join("");
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="#272C34"/>${svgBars}</svg>`;
  const pricesOk = stList.some(priceOf);
  const tail = per === "day" ? "к вчера" : per === "week" ? "к прошлой неделе" : "к прошлому месяцу";
  const avg = nDays ? curL / nDays : null;
  let cashLast = null;
  for (const s2 of stList){ const m = stReports(s2.id).filter(r => r.slot === "08" && r.cash != null).sort((a, b) => a.date < b.date ? 1 : -1)[0]; if (m) cashLast = (cashLast || 0) + m.cash; }
  return `${heroTitle(st ? st.name : "Вся сеть", "Аналитика", true)}
    <div class="an-seg" role="group" aria-label="Период">${[["day","День"],["week","Неделя"],["month","Месяц"]].map(([k, l]) => `<button type="button" data-act="anPer" data-p="${k}" aria-pressed="${per === k}">${l}</button>`).join("")}</div>
    ${S.stations.length > 1 ? `<div class="fchips">${[["", "Все"]].concat(S.stations.map(x => [x.id, x.name])).map(([id, nm]) => `<button type="button" data-act="anSid" data-sid="${esc(id)}" aria-pressed="${(sid || "") === id}">${esc(nm)}</button>`).join("")}</div>` : ""}
    <div class="card"><div class="label">${esc(title)}</div>${chart}${per !== "day" ? `<div class="hint" style="font-size:14px">Тёмный столбец — сутки ещё идут.</div>` : ""}</div>
    <div class="card"><div class="kv">
      <div><span>Продано</span><b class="num">${fmt(curL)} л<small>${deltaHtml(prevL, tail)}</small></b></div>
      <div><span>Выручка</span><b class="num">${pricesOk ? fmt(Math.round(curR)) + " ₽" : "—"}<small>${pricesOk ? deltaHtml(prevR, tail) : '<span class="cmp">укажите цену литра</span>'}</small></b></div>
      ${per !== "day" ? `<div><span>В среднем за сутки</span><b class="num">${avg != null ? fmt(Math.round(avg)) + " л" : "—"}</b></div>` : ""}
      <div><span>Касса (последнее утро)</span><b class="num">${cashLast != null ? fmt(cashLast) + " ₽" : "—"}</b></div>
    </div></div>
    <p class="hint" style="margin:0;font-size:14px">Выручка считается по текущей цене литра каждой заправки.</p>`;

  home(){ S.view = "home"; S.err = null; S.note = null; S.confirm = null; S.form = {}; top0(); },
  reload(){ S.loadErr = null; S.push = pushStatus(); if (S.push === "on") quietSync(); refresh(); return Promise.resolve(); },
  openDelivery(){ S.view = "delivery"; S.form.dl = ""; S.err = null; },
  done(){ S.flash = null; S.view = "home"; S.opSlot = null; top0(); },
  login(){ S.view = "login"; S.form.pinIn = ""; S.err = null; top0(); },
  detail(d){ S.view = "detail"; S.detailSid = d.sid; S.form = {}; S.err = null; S.confirm = null; top0(); },
  add(){ S.view = "add"; S.form = {}; S.err = null; top0(); },
  settings(){ S.view = "settings"; S.form = {}; S.err = null; S.note = null; top0();
    return run(async () => { S.settings = await call("getSettings", S.pin); }); },
  logout(){ S.pin = null; lsSet("agzs.pin", null); setTok(null); S.owner = false; S.settings = null; S.ready = false; S.mode = "operator"; S.view = "home"; S.opl = { step: "code", code: "", stations: [] }; top0(); },
  opBack(){ S.view = "home"; S.opl = { step: "code", code: "", stations: [] }; S.err = null; top0(); },
  opPick(d){
    const who = (S.form.who || "").trim();
    if (!who){ S.err = "Напишите, как вас зовут."; return; }
    return run(async () => {
      const r = await call("opRegister", { code: S.opl.code, sid: d.sid, who, ua: navigator.userAgent });
      setTok(r.tok); S.sid = r.sid; lsSet("agzs.sid", r.sid); S.revoked = false; S.form = {}; S.view = "home";
      await registerSW(); S.push = pushStatus();
      applyState(await call("getState"));
    });
  },
  reloadServer(){ return run(async () => { S.note = await call("reloadServer", S.pin); S.settings = await call("getSettings", S.pin); }); },
  revokeDev(d){
    if (S.confirm !== "rv:" + d.id){ S.confirm = "rv:" + d.id; return; }
    S.confirm = null; return run(async () => applyState(await call("revokeDevice", S.pin, d.id)));
  },
  restoreDev(d){ return run(async () => applyState(await call("restoreDevice", S.pin, d.id))); },
  enablePush(){ return run(async () => { try { await syncPush(true); } catch(e){ S.errAt = "push"; throw e; } if (S.push === "denied") S.err = null; }); },
  testPush(){ return run(async () => { S.note = await call("testPush", S.pin, S.dev); }); },
  install(){ const e = S.installEvt; if (!e) return; S.installEvt = null; e.prompt(); return Promise.resolve(); },
  copyUrl(){
    const el = document.getElementById("opLink"); const url = opLink();
    const ok = () => { S.note = "Ссылка скопирована."; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, () => { if (el){ el.focus(); el.select(); } });
    else if (el){ el.focus(); el.select(); }
    return Promise.resolve();
  },
  email(d, el){ const on = el.checked; return run(async () => { S.settings = await call("setEmail", S.pin, on); }); },
  delSt(){
    if (S.confirm !== "st"){ S.confirm = "st"; return; }
    const id = S.detailSid; S.confirm = null;
    return run(async () => { applyState(await call("deleteStation", S.pin, id)); S.view = "stations"; });
  },
  delDl(d){
    if (S.confirm !== "dl:" + d.id){ S.confirm = "dl:" + d.id; return; }
    S.confirm = null; return run(async () => applyState(await call("deleteDelivery", S.pin, d.id)));
  },
};
const SUBMIT = {
  report(){
    const st = S.stations.find(s => s.id === S.sid); if (!st) return;
    const date = workDate(), slotId = S.opSlot || autoSlot(), morning = slotId === "08";
    const v = parseNum(S.form.liters), tank = parseNum(S.form.tank), cash = parseNum(S.form.cash);
    if (!Number.isFinite(v) || v < 0){ S.err = morning ? "Введите, сколько литров продано за сутки." : "Введите, сколько литров продано с 8:00."; render(); return; }
    const b = shiftBounds(stReports(st.id), date, slotId);
    if (v < b.lo || (b.hi != null && v > b.hi)){ S.err = "Проверьте литры — они не сходятся с другими сводками этих суток."; render(); return; }
    if (morning){
      if (!Number.isFinite(tank) || tank < 0){ S.err = "Введите остаток газа в бочке."; render(); return; }
      if (st.capacity && tank > st.capacity){ S.err = `Остаток больше объёма бочки (${fmt(st.capacity)} л). Проверьте цифры.`; render(); return; }
      if (!Number.isFinite(cash) || cash < 0){ S.err = "Введите, сколько денег в кассе."; render(); return; }
    }
    if (v - b.lo > BIG_LITERS && S.confirm !== "big"){ S.confirm = "big"; render(); return; }
    S.confirm = null;
    return run(async () => {
      applyState(await call("submitReport", { sid: st.id, date, slot: slotId, liters: v, tank: morning ? tank : null, cash: morning ? cash : null }));
      S.flash = { type: "report", liters: v, cash, morning }; S.form.liters = S.form.tank = S.form.cash = ""; top0();
    });
  },
  delivery(){
    const st = S.stations.find(s => s.id === S.sid); if (!st) return;
    const v = parseNum(S.form.dl);
    if (!Number.isFinite(v) || v <= 0){ S.err = "Введите, сколько литров залили."; render(); return; }
    return run(async () => {
      applyState(await call("addDelivery", { sid: st.id, liters: v }));
      S.flash = { type: "delivery", liters: v }; S.view = "home"; S.form.dl = ""; top0();
    });
  },
  login(){
    const pin = (S.form.pinIn || "").trim();
    if (!pin){ S.err = "Введите PIN."; render(); return; }
    return run(async () => {
      const res = await call("ownerLogin", pin);
      S.settings = res; if (res.tok) setTok(res.tok);
      S.pin = pin; lsSet("agzs.pin", pin); S.owner = true; S.revoked = false; S.mode = "owner"; S.view = "home"; S.form = {}; top0();
      await registerSW(); S.push = pushStatus();
      applyState(await call("getState"));
      quietSync();
    });
  },
  opCode(){
    const code = (S.form.opCode || "").trim();
    if (!code){ S.err = "Введите код доступа."; render(); return; }
    return run(async () => {
      const list = await call("opStations", code);
      S.opl = { step: "pick", code, stations: list }; S.form = {}; top0();
    });
  },
  ownerPin(){
    const code = (S.form.newOwnerPin || "").trim();
    if (!/^\d{4,8}$/.test(code)){ S.err = "PIN — от 4 до 8 цифр."; render(); return; }
    return run(async () => { S.settings = await call("setOwnerPin", S.pin, code); S.pin = code; lsSet("agzs.pin", code); S.form.newOwnerPin = ""; S.note = "PIN владельца изменён."; });
  },
  opPin(){
    const code = (S.form.newOpPin || "").trim();
    if (!/^\d{4,8}$/.test(code)){ S.err = "Код — от 4 до 8 цифр."; render(); return; }
    return run(async () => { S.settings = await call("setOpPin", S.pin, code); S.form.newOpPin = ""; S.note = "Код для операторов изменён: " + code; });
  },
  addSt(){
    const name = (S.form.stName || "").trim(), cap = parseNum(S.form.stCap), lvl = parseNum(S.form.stLevel), sold = parseNum(S.form.stSold), price = parseNum(S.form.stPrice);
    if (!name){ S.err = "Впишите название заправки."; render(); return; }
    if (!Number.isFinite(lvl) || lvl < 0){ S.err = "Впишите, сколько газа в бочке сейчас."; render(); return; }
    if (Number.isFinite(cap) && lvl > cap){ S.err = "Газа в бочке больше, чем её объём. Проверьте цифры."; render(); return; }
    return run(async () => {
      applyState(await call("addStation", S.pin, { name, capacity: Number.isFinite(cap) ? cap : null, level: lvl, sold: Number.isFinite(sold) ? sold : 0, price: Number.isFinite(price) && price > 0 ? price : null }));
      S.view = "stations"; S.form = {};
    });
  },
  fix(){
    const v = parseNum(S.form.fixLevel);
    if (!Number.isFinite(v) || v < 0){ S.err = "Впишите уровень газа в литрах."; render(); return; }
    return run(async () => { applyState(await call("fixTank", S.pin, { id: S.detailSid, level: v })); S.form.fixLevel = ""; });
  },
  settingsSt(){
    const st = S.stations.find(s => s.id === S.detailSid); if (!st) return;
    const name = (S.form.setName ?? st.name).trim(), cap = parseNum(S.form.setCap ?? st.capacity), price = parseNum(S.form.setPrice ?? st.price);
    if (!name){ S.err = "Название не может быть пустым."; render(); return; }
    return run(async () => { applyState(await call("updateStation", S.pin, { id: st.id, name, capacity: Number.isFinite(cap) ? cap : null, price: Number.isFinite(price) && price > 0 ? price : null })); S.form.setName = undefined; S.form.setCap = undefined; S.form.setPrice = undefined; S.note = "Сохранено."; });
  },
  setApi(){
    const id = idFromInput(S.form.apiIn);
    if (!id){ S.err = "Это не похоже на ссылку Apps Script. Скопируйте «URL веб-приложения» целиком."; render(); return; }
    return run(async () => {
      S.api = apiFromId(id);
      try { applyState(await call("getState")); }
      catch(e){ S.api = null; throw e; }
      lsSet("agzs.api", id); S.form = {};
      await registerSW(); S.push = pushStatus();
    });
  },
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "INPUT") return;
  const fn = A[b.dataset.act]; if (!fn) return;
  const r = fn(b.dataset, b); if (!(r instanceof Promise)) render();
});
document.addEventListener("change", e => {
  const el = e.target; if (el.tagName !== "INPUT" || el.type !== "checkbox" || !el.dataset.act) return;
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-submit]"); if (!f) return;
  e.preventDefault(); const fn = SUBMIT[f.dataset.submit]; if (fn) fn();
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.f; if (!k) return;
  S.form[k] = e.target.value;
  if (k === "liters"){ if (S.confirm === "big"){ S.confirm = null; render(); } else updateCalc(); }
  if (S.err){ S.err = null; const m = document.querySelector('.msg.bad[role="alert"]'); if (m && !m.closest("#calc")) m.remove(); }
});
setInterval(() => { if (document.visibilityState === "visible" && !S.busy) refresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - S.lastSync > 20000) refresh(); });

// ---------- пример без сервера (для проверки дизайна) ----------
const Demo = {
  st: [], rep: [], del: [], opPin: "704747",
  dev: [
    { dev: "p1", sid: "d1", who: "Мария", owner: false, at: Date.now() - 3*86400000, seen: Date.now() - 40*60000, active: true, push: true, ua: "Android" },
    { dev: "p2", sid: "d1", who: "Сергей", owner: false, at: Date.now() - 9*86400000, seen: Date.now() - 2*86400000, active: true, push: false, ua: "Android" },
  ],
  seed(){
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const now = new Date(), today = curWorkDay(), start = parseDate(shiftDate(today, -8)).getTime() + 9*3600000;
    this.st = [
      { id: "d1", name: "Промка (пример)", capacity: 10000, price: 28.5, baseLevel: 9000, baseAt: start, baseCum: 0, createdAt: start },
      { id: "d2", name: "У трассы (пример)", capacity: 20000, price: 29, baseLevel: 17000, baseAt: start, baseCum: 0, createdAt: start + 1 },
    ];
    this.del.push({ id: "v1", sid: "d1", liters: 5000, at: parseDate(shiftDate(today, -4)).getTime() + 14*3600000 });
    for (const st of this.st){
      for (let i = 7; i >= 0; i--){
        const d = shiftDate(today, -i), next = shiftDate(d, 1), t0 = parseDate(d).getTime();
        const c14 = Math.round(250 + rnd() * 150), c18 = c14 + Math.round(250 + rnd() * 150), c22 = c18 + Math.round(200 + rnd() * 150), tot = c22 + Math.round(100 + rnd() * 150);
        const push = (date, slot, value, at, extra) => { if (at < Date.now()) this.rep.push({ key: `${date}_${slot}`, sid: st.id, date, slot, value, at, ...extra }); };
        push(d, "14", c14, t0 + 14*3600000 + 300000);
        push(d, "18", c18, t0 + 18*3600000 + 300000);
        push(d, "22", c22, t0 + 22*3600000 + 300000);
        if (!(i === 1 && st.id === "d2")) push(next, "08", tot, t0 + 32*3600000 + 300000, { tank: null, cash: Math.round(30000 + rnd() * 40000) });
      }
      // фактический остаток утром — расчётный плюс небольшая погрешность
      this.rep.filter(r => r.sid === st.id && r.slot === "08").sort((a,b) => a.at - b.at).forEach(r => {
        const s = this.state().stations.find(x => x.id === st.id), m = this.state().reports.find(x => x.key === r.key && x.sid === st.id);
        r.tank = Math.round(m.expected + (rnd() - 0.6) * 80);
      });
    }
  },
  state(){
    const st = this.st.map(s => ({ ...s })), rep = this.rep.map(r => ({ ...r }));
    for (const s of st) computeStation(s, rep.filter(r => r.sid === s.id), this.del.filter(d => d.sid === s.id), ms => dkey(new Date(ms - 8*3600000)));
    return { stations: st, reports: rep, deliveries: this.del.slice(), devices: this.dev.map(d => ({ ...d })) };
  },
  async call(fn, a){
    await new Promise(r => setTimeout(r, 250));
    const settings = { email: "example@gmail.com", emailOn: true, ownerPhones: 1, phones: this.st.map((s,i) => ({ name: s.name, count: i ? 0 : 2 })), sheetUrl: "", defaultPin: false, opPin: this.opPin || "704747" };
    switch (fn){
      case "getState": return this.state();
      case "submitReport": { const p = a[0]; const key = `${p.date}_${p.slot}`; this.rep = this.rep.filter(r => !(r.sid === p.sid && r.key === key)); this.rep.push({ key, sid: p.sid, date: p.date, slot: p.slot, value: p.liters, tank: p.tank, cash: p.cash, at: Date.now() }); return this.state(); }
      case "addDelivery": this.del.push({ id: "v" + Date.now(), sid: a[0].sid, liters: a[0].liters, at: Date.now() }); return this.state();
      case "ownerLogin": return { ...settings, tok: "demo" };
      case "getSettings": case "setEmail": return settings;
      case "setOpPin": this.opPin = a[1]; return { ...settings, opPin: a[1] };
      case "setOwnerPin": return settings;
      case "reloadServer": return "В примере сервер не обновляется.";
      case "revokeDevice": case "restoreDevice": { const d = this.dev.find(x => x.dev === a[1]); if (d) d.active = fn === "restoreDevice"; return this.state(); }
      case "opStations": return this.st.map(s => ({ id: s.id, name: s.name }));
      case "opRegister": return { tok: "demo", sid: a[0].sid };
      case "addStation": { const p = a[1], t = Date.now(); this.st.push({ id: "d" + t, name: p.name, capacity: p.capacity, price: p.price, baseLevel: p.level, baseAt: t, baseCum: p.sold || 0, createdAt: t }); return this.state(); }
      case "updateStation": { const s = this.st.find(x => x.id === a[1].id); Object.assign(s, { name: a[1].name, capacity: a[1].capacity, price: a[1].price }); return this.state(); }
      case "fixTank": { const o = this.st.find(x => x.id === a[1].id); Object.assign(o, { baseLevel: a[1].level, baseAt: Date.now(), baseCum: cumNow(o.id) }); return this.state(); }
      case "deleteStation": this.st = this.st.filter(x => x.id !== a[1]); return this.state();
      case "deleteDelivery": this.del = this.del.filter(x => x.id !== a[1]); return this.state();
      case "subscribe": return { ok: true };
      case "testPush": return "В примере уведомления не отправляются.";
      default: throw new Error("В примере это недоступно.");
    }
  },
};

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has("demo")){ S.demo = true; Demo.seed(); S.pin = "demo"; S.api = "demo"; }
  else {
    const fromLink = idFromInput(q.get("s"));
    if (fromLink) lsSet("agzs.api", fromLink);
    if (q.has("s")) history.replaceState(null, "", location.pathname);
    const saved = lsGet("agzs.api");
    const id = saved || DEFAULT_SERVER; S.api = id ? apiFromId(id) : null;
    S.usingDefault = !saved && !!DEFAULT_SERVER;
  }
  S.dev = lsGet("agzs.dev");
  if (!S.dev){ S.dev = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^\w-]/g, ""); lsSet("agzs.dev", S.dev); }
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; render(); });
  window.addEventListener("appinstalled", () => { S.installEvt = null; render(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => { if (e.data === "refresh") refresh(); });
  render();
  if (!S.api) return;
  if (S.pin){
    try { const res = await call("ownerLogin", S.pin); S.settings = res; if (res.tok) setTok(res.tok); S.owner = true; S.mode = "owner"; }
    catch(e){ if (/PIN/.test(errText(e))){ S.pin = null; lsSet("agzs.pin", null); } }
  }
  await registerSW();
  S.push = pushStatus();
  if (!S.owner && !S.tok){
    if (S.usingDefault){   // проверим, что встроенный адрес сервера отвечает
      try { await call("getState"); } catch(e){ if (!e.code){ S.api = null; } }
    }
    render(); return;
  }
  await refresh();
  if (!S.ready && S.usingDefault && S.loadErr){ S.api = null; S.loadErr = null; render(); return; }   // встроенный адрес не ответил — спросим вручную
  if (S.push === "on") quietSync();
})();
})();
